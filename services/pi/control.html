<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>duet.ai · LYDIA</title>
<style>
body{font:17px system-ui;background:#121714;color:#ecf4ed;margin:0;padding:28px;max-width:680px;margin:auto}h1{font-size:42px;margin-bottom:4px}h1 span{color:#a8ec73}p{color:#bac7bd;line-height:1.5}.panel{background:#202a24;border:1px solid #3c5142;padding:20px;border-radius:16px;margin-top:18px}.readout{font-size:30px;font-weight:600}label{display:block;margin-top:20px}button,select,input[type=number]{font:inherit;background:#35493b;color:inherit;border:1px solid #698871;border-radius:8px;padding:11px;margin:5px 5px 5px 0}button[aria-pressed=true]{background:#a8ec73;color:#132015}button:disabled{opacity:.4}input[type=range]{width:100%;accent-color:#a8ec73}.muted{font-size:14px;color:#9fb4a5}#error{color:#ffb295}
</style>
<h1>duet<span>.ai</span></h1><p>LYDIA edition · sound plays on the pedal.</p>
<section class="panel"><div id="status">Connecting to LYDIA…</div><p class="readout" id="music">—</p><p id="sound"></p><p id="error"></p><button id="transport">Pause</button><button id="mic">Mute input</button><p class="muted" id="input">Input —</p></section>
<section class="panel"><div id="parts"></div>
<label>Engine <select id="engine"><option value="patterns">Patterns · offline</option><option value="amt">AMT · local model</option></select></label>
<label>Style <select id="genre"><option value="lofi">Lo-fi</option><option value="funk">Funk</option><option value="rock">Rock</option><option value="jazz">Jazz</option></select></label>
<label>Creativity <input id="creativity" type="range" min="0" max="1" step="0.05"></label>
<label>Intensity <input id="intensity" type="range" min="0" max="1" step="0.05"></label>
<label>Tempo <input id="bpm" type="number" min="40" max="240" value="100"><button id="tempo">Set tempo</button><button id="auto">Follow input</button></label>
</section><p class="muted">Play a steady phrase into LYDIA to let the band find your tempo and key. Or set a tempo to start immediately.</p>
<script>
let state={};const $=id=>document.getElementById(id);
async function send(command){try{const r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(command)});if(!r.ok)throw new Error((await r.json()).error)}catch(e){$('error').textContent=e.message}}
for(const instrument of ['drums','bass','keys','lead']){const b=document.createElement('button');b.textContent=instrument;b.id='part-'+instrument;b.onclick=()=>send({type:'toggle',instrument});$('parts').append(b)}
for(const field of ['engine','genre','creativity','intensity']){$(field).onchange=e=>send({type:'set',field,value:e.target.type==='range'?Number(e.target.value):e.target.value})}
$('transport').onclick=()=>send({type:'transport',playing:state.power!=='on'});
$('mic').onclick=()=>send({type:'mic',muted:!state.micMuted});
$('tempo').onclick=()=>send({type:'bpm',bpm:Number($('bpm').value)});
$('auto').onclick=()=>send({type:'bpm',bpm:null});
async function poll(){try{const r=await fetch('/api/status');state=await r.json();$('status').textContent=!state.online?'Starting audio engine…':state.power!=='on'?'Paused':state.locked?'Playing with you':'Listening for your phrase';$('music').textContent=[state.bpm?Math.round(state.bpm)+' BPM':'Tempo —',state.key||'Key —',state.chord||''].filter(Boolean).join(' · ');$('error').textContent=state.error||'';$('sound').textContent='Keyboard: '+(state.soundLabel||'—')+' · White noise '+Number(state.noiseVolume||0).toFixed(2);$('input').textContent='Input '+Math.round((state.inputLevel||0)*100)+'% · '+(state.sources?.mic==='on'?'audio connected':'audio unavailable');$('transport').textContent=state.power==='on'?'Pause':'Play';$('mic').textContent=state.micMuted?'Unmute input':'Mute input';for(const i of ['drums','bass','keys','lead'])$('part-'+i).setAttribute('aria-pressed',String(!!state.enabled?.[i]));for(const f of ['engine','genre','creativity','intensity'])if(document.activeElement!==$(f)&&state[f]!==undefined)$(f).value=state[f]}catch(e){$('status').textContent='LYDIA disconnected'}setTimeout(poll,500)}poll();
</script></html>
