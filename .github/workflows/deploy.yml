name: deploy
on: { push: { branches: [main] } }
permissions: { contents: read, pages: write, id-token: write }
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Cache MIR-1K subset
        id: mir1k-cache
        uses: actions/cache@v4
        with:
          path: bench/realvoice/data
          key: mir1k-subset-v1
      - name: Fetch MIR-1K subset (best effort)
        if: steps.mir1k-cache.outputs.cache-hit != 'true'
        run: bash bench/realvoice/fetch.sh
      - run: npm run bench:gate
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm --prefix relay ci && npm --prefix relay run typecheck
      - run: python3 -m pip install pytest
      - run: python3 -m pytest services/amt -q
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: public/samples/amt
          key: amt-samples-${{ hashFiles('services/amt-samples-manifest.json') }}
      - run: npm run build
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Gate release on microphone-to-sampled-audio playback
        run: npm run smoke:voice
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-voice-smoke
          path: test-results/voice-smoke
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: [build, gate]
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  # soundofthe.world serves the app from the site root, so it needs its own
  # build with base "/" — the GitHub Pages one above is based at /backline/.
  pages:
    needs: [build, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: public/samples/amt
          key: amt-samples-${{ hashFiles('services/amt-samples-manifest.json') }}
      - run: npm run samples:amt
      - run: npx vite build --base=/ --outDir dist-root
      - run: npx wrangler@3 pages deploy dist-root --project-name backline --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
