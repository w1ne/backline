name: preview
on:
  push:
    branches-ignore: [main]
permissions: { contents: read }
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Cache MIR-1K subset
        id: mir1k-cache
        uses: actions/cache@v4
        with:
          path: bench/realvoice/data
          key: mir1k-subset-v1
      - name: Fetch MIR-1K subset (best effort)
        if: steps.mir1k-cache.outputs.cache-hit != 'true'
        run: bash bench/realvoice/fetch.sh
      - run: npm run bench:gate
  preview:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: public/samples/amt
          key: amt-samples-${{ hashFiles('services/amt-samples-manifest.json') }}
      - run: npm run samples:amt
      - run: npx vite build --base=/
      - run: npx wrangler@3 pages deploy dist --project-name backline --branch "${GITHUB_REF_NAME}" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: echo "Preview at https://${GITHUB_REF_NAME//[^a-zA-Z0-9]/-}.backline-88n.pages.dev"
